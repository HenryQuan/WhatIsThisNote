name: whatisthisnote
description: >-
  Learn to read music by dragging a note around the staff. Ledger lines and
  note names are shown in real time.
publish_to: 'none'

version: 0.3.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  audioplayers: ^6.8.1
  cupertino_icons: ^1.0.8
  dynamic_color: ^1.7.0
  intl: any
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf
