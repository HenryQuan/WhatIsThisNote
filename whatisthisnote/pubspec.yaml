name: whatisthisnote
description: >-
  Learn to read music by dragging a note around the staff. Ledger lines and
  note names are shown in real time.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dynamic_color: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf
